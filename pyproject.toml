[project]
name = "video2urdf"
version = "0.1.0"
description = "Phone video of an articulated object -> measured URDF/MJCF, verified in MuJoCo"
requires-python = ">=3.12"
dependencies = [
    "mapbox-earcut>=2.1.0",
    "meta-sam-parser>=0.1.0",
    "modal>=1.6",
    "mujoco>=3.3",
    "numba>=0.68.1",
    "numpy>=2.0",
    "openai>=1.100",
    "opencv-python>=4.10",
    "pillow>=13.0.0",
    "python-dotenv>=1.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
]

[tool.uv]
package = false
